<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GIFA 舞台层</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; user-select: none;
               background: #0b0d12; color: #cfd6e4;
               font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
  /* 顶边一条 2px 亮线：一眼能看出舞台实际从哪里开始 */
  #topline { position: absolute; left: 0; right: 0; top: 0; height: 2px;
             background: #35d96b; }
  #video { position: absolute; inset: 2px 0 0 0;
           background: radial-gradient(120% 90% at 30% 20%, #1b2a4a 0%, #0b0d12 60%); }
  #center { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; pointer-events: none; }
  #center .big { font-size: 20px; font-weight: 600; color: #e8eefc; }
  #center .sub { color: #7c8598; }
  .tag { position: absolute; background: rgba(0,0,0,.45); border-radius: 6px; padding: 5px 9px;
         font-size: 12px; color: #dfe6f3; }
  #clicks { right: 10px; top: 10px; }
  #hint { left: 10px; bottom: 10px; }
  #cta { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
         background: #fff; color: #b40; font-weight: 700; padding: 9px 16px; border-radius: 9px;
         box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor: pointer; }
</style>
</head>
<body>
  <div id="video">
    <div id="topline"></div>
    <div id="center">
      <div class="big">舞台层 · B 站播放器占位</div>
      <div class="sub">这一整块区域必须能点到（鼠标事件不该被 chrome 挡）</div>
    </div>
    <div id="clicks" class="tag">clicks: 0</div>
    <div id="hint" class="tag">点这里 & 拖右下角试试</div>
    <div id="cta">点我计数</div>
  </div>

<script>
  const post = (m) => { try { window.ipc.postMessage(JSON.stringify(m)); } catch (_) {} };
  let n = 0;
  const label = document.getElementById('clicks');
  document.addEventListener('mousedown', (e) => {
    n += 1;
    label.textContent = 'clicks: ' + n;
    post({ t: 'stage-click', n, x: e.clientX, y: e.clientY });
  });
  post({ t: 'stage-ready', w: innerWidth, h: innerHeight, dpr: devicePixelRatio });
</script>
</body>
</html>
