[package]
name = "shell-demo"
version = "0.1.0"
description = "gifa-shell 骨架的演示 + 自检（M1 出口验证）"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gifa-core = { path = "../../crates/gifa-core" }
gifa-input = { path = "../../crates/gifa-input" }
gifa-shell = { path = "../../crates/gifa-shell" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
